technical_controls_published:
- Encryption in transit and at rest (DPA section 5)
- Access controls and authentication mechanisms (DPA section 5)
- Logical separation of client data (DPA section 5)
- Strict origin checking - payloads from unauthorized domains rejected with HTTP 403
- Client-side PII/password/form-input masking before transmission (session replay)
- IP addresses processed transiently for geo/network classification, raw IP never stored
- Cookieless by design; first-party LocalStorage/SessionStorage only
- HSTS enabled with max-age 31536000; TLS 1.3; CAA records published (see security/apstal-domain-security.yml)
