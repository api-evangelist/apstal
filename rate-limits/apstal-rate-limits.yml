response_headers:
  published: []
  note: >-
    THIS IS THE GAP. Apstal documents a 429 ("Rate limit exceeded. Retry after the specified
    delay.") but names no response header - no RateLimit-*, no X-RateLimit-*, no Retry-After. An
    agent cannot read remaining budget or a retry delay from an HTTP response; it can only see
    the status code. The one machine-readable budget signal Apstal does publish is in-band and
    MCP-only (the `creditsRemaining` field on tool responses).
