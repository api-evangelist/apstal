name: Apstal
description: >-
  AI-first website analytics and visitor tracking platform that replaces traditional dashboards with a
  natural-language chatbot interface, offering conversational analytics, cookieless tracking, session
  replays, heatmaps, funnels, error tracking, Core Web Vitals and AI-agent traffic detection. Apstal is
  agent-native by design: its primary programmatic surface is a hosted MCP server at
  https://apstal.com/api/mcp (JSON-RPC 2.0 over Streamable HTTP, protocol 2025-06-18) whose tools/list is
  answerable anonymously, backed by a documented REST ingestion and stats API, a WebSocket real-time
  stream, an SSE natural-language query endpoint, an A2A agent card, two provider-authored Agent Skills,
  an llms.txt, OAuth 2.0 authorization-server and protected-resource metadata, and an MCP server card.
  The company is based in Poland and publishes a GDPR Data Processing Agreement.
