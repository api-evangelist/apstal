  - name: Apstal Analytics API
    description: >-
      Documented REST surface for programmatic access to Apstal analytics: POST /api/v1/m for batched event
      ingestion (max 100 events per request), POST /api/v1/stream for rrweb session-replay chunk upload,
      GET /api/analytics/quick for aggregated dashboard metrics, and POST /api/ai/semantic for
      natural-language analytics queries answered as a text/event-stream. A WebSocket service at
      wss://ws.apstal.com carries tracker, dashboard and replay-viewer connections. Authentication is a
      Bearer API key (apstal_ prefix) or a Supabase session JWT. No OpenAPI is published.
    humanURL: https://apstal.com/docs/api
