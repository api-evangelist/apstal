note: >-
  One first-party package exists. It is a browser TRACKER, not an API client - there is no
  first-party SDK for the MCP server or for the documented REST endpoints in any language. The
  API reference itself says only that "community-supported wrappers for Node.js, Python, and PHP
  are available on the integrations page"; no such wrappers were found in any registry and the
  integrations pages document script tags and CMS plugins, not client libraries.
