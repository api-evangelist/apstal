note: >-
  Apstal publishes NO OpenAPI, so there are no operationIds to bind to. The `rest:` column below
  therefore carries documented METHOD + PATH from the API reference instead of an operationId,
  and every row says so. Nothing here is invented: a tool is only bound to a REST endpoint when
  the two are documented to do the same thing on the same host. Where no public REST endpoint
  exists, the tool is listed in mcp_only[] rather than given a guessed binding.
